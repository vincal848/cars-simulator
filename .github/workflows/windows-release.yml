name: Windows download
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - run: python -m pip install . pygame-ce==2.5.8 pyinstaller==6.22.3
      - run: python -m unittest discover -s tests -t .
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - run: python packaging/windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CARS-Windows
          path: dist/CARS-Windows.zip
          if-no-files-found: error
